[mcu toolhead]
canbus_uuid: 89266531602e
canbus_interface: can0

[adxl345]
cs_pin: toolhead: PB12
spi_software_sclk_pin: toolhead: PB10
spi_software_mosi_pin: toolhead: PB11
spi_software_miso_pin: toolhead: PB2
axes_map: x,y,z

## Bondtech LGX
[extruder]
step_pin: toolhead: PD0
dir_pin: !toolhead: PD1
enable_pin: !toolhead: PD2

heater_pin: toolhead: PB13
sensor_pin: toolhead: PA3
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982

full_steps_per_rotation: 200
rotation_distance: 7.924672 # 8 in BT docs
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
sensor_type: SliceEngineering 450
min_temp: 0
max_temp: 270
min_extrude_temp: 170
max_extrude_only_distance: 150
max_extrude_cross_section: 0.8
pressure_advance: 0.04
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: toolhead: PA15
run_current: 0.45
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

[fan]
pin: toolhead: PA0

[heater_fan hotend_fan]
pin: toolhead: PA1
heater: extruder
heater_temp: 50.0

[neopixel hotend_rgb]
pin: toolhead:PD3
chain_count: 3
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 1.0

[bltouch]
sensor_pin: ^toolhead:PB8
control_pin: toolhead:PB9

pin_move_time: 0.680
stow_on_each_sample: True
probe_with_touch_mode: False
speed: 100
lift_speed: 200
samples: 2
sample_retract_dist: 10
samples_tolerance: 0.150
samples_tolerance_retries: 4
x_offset: -37
y_offset: -11
#z_offset: 3.170

#[filament_switch_sensor switch_sensor]
#switch_pin: toolhead:PB4

#[filament_motion_sensor motion_sensor]
#switch_pin: ^toolhead:PB3

[z_tilt]
# bed joint pos
z_positions: 30,10 # z0 (front left)
  196.5,355        # z1 (back)
  370,10           # z2 (front right)

# probe pos
points: 61,18 # z0 (front left)
  233.5,355   # z1 (back)
  390,18      # z2 (front right)

speed: 60
horizontal_move_z: 10
retries: 5
# retry_tolerance: 0.0075
retry_tolerance: 0.150

[safe_z_home]
home_xy_position: 196.5,179
speed: 100
z_hop: 5
z_hop_speed: 15

