[include mainsail.cfg]

[exclude_object]

[idle_timeout]
timeout: 1800
gcode:
    RESPOND MSG="Idle timeout reached"
    TURN_OFF_HEATERS
    M84

[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 0.1

[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 25000
max_z_velocity: 12
max_z_accel: 350
square_corner_velocity: 25

#--------------------------------------------#
##### BTT MANTA M8P v2 MCU definition ########
#--------------------------------------------#

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_150016001951313236343430-if00
##--------------------------------------------------------------------

#--------------------------------------------#
#### Beacon                           ########
#--------------------------------------------#

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevD_17A0272A4E5737374D202020FF073020-if00
x_offset: 0
y_offset: 24
mesh_main_direction: x
mesh_runs: 2
##--------------------------------------------------------------------

[z_tilt] # nozzle pos
z_positions:
  -50, 18
  175, 398
  400, 18
points:
  30, 5
  175, 295
  320, 5
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
##--------------------------------------------------------------------

[bed_mesh]
speed: 500
mesh_min: 0,0
mesh_max: 350,340
probe_count: 40,10
algorithm: bicubic
fade_start: 0.6
fade_end: 10.0
##--------------------------------------------------------------------

[safe_z_home]
home_xy_position: 170,170
z_hop: 10
##--------------------------------------------------------------------

#--------------------------------------------#
#### Nozzle ADXL                      ########
#--------------------------------------------#
# [mcu ampon]
# serial: /dev/serial/by-id/usb-Anchor_Ampon-if00

# [adxl345]
# cs_pin: ampon:CS

# [resonance_tester]
# accel_chip: adxl345
# probe_points: 185,200,20
# accel_per_hz: 175

# [input_shaper]
# shaper_freq_x: 122.2
# shaper_freq_y: 92.2
# shaper_type_x: mzv
# shaper_type_y: mzv
##--------------------------------------------------------------------

#--------------------------------------------#
#### bed                              ########
#--------------------------------------------#

[heater_bed]
heater_pin: PA1
sensor_pin: PB1
sensor_type: ATC Semitec 104GT-2
min_temp: 0
max_temp: 130
##--------------------------------------------------------------------

#--------------------------------------------#
#### Extruder                         ########
#--------------------------------------------#

[extruder]
step_pin: PC7
dir_pin: PC8
enable_pin: !PD2
heater_pin: PA0
rotation_distance: 22.67895
gear_ratio: 50:8
microsteps: 16
full_steps_per_rotation: 200
min_temp: 0
max_temp: 400
min_extrude_temp: 170
nozzle_diameter: 0.400
filament_diameter: 1.750
sensor_type: PT1000
sensor_pin: PB0
pullup_resistor: 2200

[tmc2209 extruder]
uart_pin: PC6
run_current: 0.5
interpolate: False
stealthchop_threshold: 0
##--------------------------------------------------------------------

#--------------------------------------------#
#### X/Y motor definition             ########
#--------------------------------------------#

# Motor1
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
endstop_pin: tmc5160_stepper_x:virtual_endstop #^PF4
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
homing_speed: 150
homing_retract_dist: 0

position_min: 0
position_endstop: 350
position_max: 350

#dk
use_sensorless_homing: True
homing_retract_dist: 10.0

[tmc5160 stepper_x]
cs_pin: PC13
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
sense_resistor: 0.022
diag1_pin: ^!PF4
driver_SGT: 1
run_current: 2
interpolate: False
stealthchop_threshold: 0

#dk
home_current: 1
##--------------------------------------------------------------------

# Motor2
[stepper_y1]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

[tmc5160 stepper_y1]
cs_pin: PE3
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
sense_resistor: 0.022
diag1_pin: ^!PF3
driver_SGT: 1
run_current: 2
interpolate: False
stealthchop_threshold: 0

#dk
home_current: 1
##--------------------------------------------------------------------

# Motor3
[stepper_y]
