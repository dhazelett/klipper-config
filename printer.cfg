[include mainsail.cfg]

[exclude_object]

[idle_timeout]
timeout: 1800
gcode:
    RESPOND MSG="Idle timeout reached"
    TURN_OFF_HEATERS
    M84

[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 0.1

[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 25000
max_z_velocity: 12
max_z_accel: 350
square_corner_velocity: 25

#--------------------------------------------#
##### BTT MANTA M8P v2 MCU definition ########
#--------------------------------------------#

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_150016001951313236343430-if00
##--------------------------------------------------------------------

#--------------------------------------------#
#### Beacon                           ########
#--------------------------------------------#

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevD_17A0272A4E5737374D202020FF073020-if00
x_offset: 0
y_offset: 24
mesh_main_direction: x
mesh_runs: 2

[resonance_tester]
accel_chip: beacon
probe_points: 90, 90, 20
##--------------------------------------------------------------------

[z_tilt] # nozzle pos
z_positions:
  -50, 18
  175, 398
  400, 18
points:
  30, 5
  175, 295
  320, 5
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
##--------------------------------------------------------------------

[bed_mesh]
speed: 150
mesh_min: 30,24
mesh_max: 315,300
probe_count: 40,10
algorithm: bicubic
# fade_start: 0.6
# fade_end: 10.0
##--------------------------------------------------------------------

[safe_z_home]
home_xy_position: 170,170
z_hop: 10
##--------------------------------------------------------------------

#--------------------------------------------#
#### Nozzle ADXL                      ########
#--------------------------------------------#
# [mcu ampon]
# serial: /dev/serial/by-id/usb-Anchor_Ampon-if00

# [adxl345]
# cs_pin: ampon:CS

# [resonance_tester]
# accel_chip: adxl345
# probe_points: 185,200,20
# accel_per_hz: 175

# [input_shaper]
# shaper_freq_x: 122.2
# shaper_freq_y: 92.2
# shaper_type_x: mzv
# shaper_type_y: mzv
##--------------------------------------------------------------------

#--------------------------------------------#
#### bed                              ########
#--------------------------------------------#

[heater_bed]
heater_pin: PA1
sensor_pin: PB1
sensor_type: ATC Semitec 104GT-2
min_temp: 0
max_temp: 130

#control: mpc
heater_power: 800
##--------------------------------------------------------------------

#--------------------------------------------#
#### Extruder                         ########
#--------------------------------------------#

[extruder]
step_pin: PC7
dir_pin: PC8
enable_pin: !PD2
heater_pin: PA0
min_temp: 0
max_temp: 400
min_extrude_temp: 170
sensor_type: PT1000
sensor_pin: PB0
pullup_resistor: 2200

microsteps: 16
gear_ratio: 50:8
rotation_distance: 22.67895
full_steps_per_rotation: 200
nozzle_diameter: 0.4

#control: mpc
heater_power: 120  
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8 

[tmc2209 extruder]
uart_pin: PC6
interpolate: True
run_current: 0.3
sense_resistor: 0.110
stealthchop_threshold: 0
##--------------------------------------------------------------------

#--------------------------------------------#
#### X/Y motor definition             ########
#--------------------------------------------#

####################
# Y0 B0      X0 A0 #
# M1            M3 #
#                  #
# M2            M4 #
# X1 A1      Y1 B1 #
####################

# Motor1 (back left A0)
[stepper_y]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
endstop_pin: tmc5160_stepper_y:virtual_endstop
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
homing_speed: 150
position_min: 0
position_endstop: 350
position_max: 350
homing_retract_dist: 10.0

[tmc5160 stepper_y]
