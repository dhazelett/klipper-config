## Motor1 B (rear left)
[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: !toolhead:PB6
position_min: 0
position_max: 393
position_endstop: 393
homing_speed: 100
homing_retract_dist: 0
# homing_positive_dir: True

[tmc2209 stepper_x]
uart_pin: PC13
#diag_pin: PF4
run_current: 0.800
interpolate: False
stealthchop_threshold: 999999

## Motor2 A (rear right)
[stepper_y]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE4
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: ^PF4
position_min: 0 # 22
position_max: 358 #381 # 385 - 22
position_endstop: 358
homing_speed: 100
homing_retract_dist: 0
# homing_positive_dir: True

[tmc2209 stepper_y]
uart_pin: PE3
#diag_pin: PF3
run_current: 0.800
interpolate: False
stealthchop_threshold: 999999

