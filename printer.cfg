[include mainsail.cfg]

[exclude_object]

[idle_timeout]
timeout: 1800
gcode:
    RESPOND MSG="Idle timeout reached"

[pause_resume]

[display_status]

[respond]

[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 0.1

# host MCU service is preinstalled and ready to use with:
[mcu]
canbus_uuid: 5e3afb1d9fdb
canbus_interface: can0

[printer]
kinematics: corexy
max_velocity: 250
max_accel: 10000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0

