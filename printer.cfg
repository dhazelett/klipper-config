spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
sense_resistor: 0.022
diag1_pin: ^!PF4
driver_SGT: 1
run_current: 1.5 # 2 max??
interpolate: False
stealthchop_threshold: 0
home_current: 1
##--------------------------------------------------------------------

# Motor2 (front left B1)
[stepper_x1]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200

[tmc5160 stepper_x1]
