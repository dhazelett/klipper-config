dir_pin:             !PG12
enable_pin:          !PG15
microsteps:          16
rotation_distance:   4
endstop_pin:         probe:z_virtual_endstop
position_max:        390
position_min:        0
homing_speed:        8
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PG14
run_current: 1.000
stealthchop_threshold: 999999

